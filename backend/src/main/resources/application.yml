spring:
  profiles:
    default: dev
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  config:
    import: optional:classpath:application-local.yml
  datasource:
    hikari:
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
server:
  port: ${PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health
      discovery:
        enabled: false
      cors:
        allowed-origins: ${snoozeshare.cors.allowed-origin}
        allowed-methods: GET,OPTIONS
        allowed-headers: Authorization,Content-Type
        max-age: 3600s
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: false
  health:
    defaults:
      enabled: false
    db:
      enabled: true
