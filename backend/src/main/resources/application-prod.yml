spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
snoozeshare:
  security:
    enabled: ${SNOOZESHARE_SECURITY_ENABLED}
  proxy:
    trust-forwarded-headers: ${SNOOZESHARE_TRUST_FORWARD_HEADERS}
  firebase:
    enabled: ${FIREBASE_ENABLED}
    project-id: ${FIREBASE_PROJECT_ID}
  registration:
    host-code: ${SNOOZESHARE_HOST_REGISTRATION_CODE}
    agent-code: ${SNOOZESHARE_AGENT_REGISTRATION_CODE}
  cors:
    allowed-origin: ${SNOOZESHARE_CORS_ALLOWED_ORIGIN}
  ai:
    enabled: ${SNOOZESHARE_AI_ENABLED}
    mock: ${SNOOZESHARE_AI_MOCK:false}
    base-url: ${SOCLAAS_BASE_URL:}
    api-key: ${SOCLAAS_API_KEY:}
    model-fast: ${SNOOZESHARE_AI_MODEL_FAST:llama3.1:8b}
    model-standard: ${SNOOZESHARE_AI_MODEL_STANDARD:qwen3.5:9b}
    model-strong: ${SNOOZESHARE_AI_MODEL_STRONG:gemma4:26b}
