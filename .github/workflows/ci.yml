name: CI

# Checkstyle runs on every push to any branch (fast, no display needed). The full build, with the
# JUnit and TestFX suites, runs on every pull request and on every push to development or main, so
# each merged result is checked as well as the branch that produced it. `checkstyle` and `build` are
# the required status checks on both branches.
on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checkstyle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Checkstyle (main and test sources)
        run: ./gradlew checkstyleMain checkstyleTest --no-daemon
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: checkstyle-reports
          path: build/reports/checkstyle

  build:
    # Pull requests, and pushes to development or main; a plain feature-branch push is covered by
    # checkstyle until its pull request opens.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test (xvfb gives the TestFX suites a virtual display)
        run: xvfb-run -a ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: build/reports/tests
