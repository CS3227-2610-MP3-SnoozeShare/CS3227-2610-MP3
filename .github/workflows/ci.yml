name: CI

# Checkstyle runs on every push to any branch (fast, no display needed). The full build, with the
# JUnit and TestFX suites, runs on every pull request and on every push to development or main, so
# each merged result is checked as well as the branch that produced it. `checkstyle` and `build` are
# the required status checks on both branches, and each covers desktop, backend and frontend.
# A push that changes only the state files or documentation cannot break a build, so it does not run CI
# (`paths-ignore` is on push only: a pull request always runs, because its required checks must report).
# A pull request into development also fails `build` if it merges a branch state that is not Approved.
on:
  push:
    paths-ignore:
      - 'PROJECT_STATE.md'
      - 'AGENTS.md'
      - 'docs/**'
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # A push to a branch that already has an open pull request would repeat the checks the pull_request
  # event runs for the same commit, so the push run stops here. Pushes to development and main always
  # run (they check the merged result).
  dedupe:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has_pr: ${{ steps.pr.outputs.has_pr }}
    steps:
      - id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ "$BRANCH" = "development" ] || [ "$BRANCH" = "main" ]; then
            echo "has_pr=0" >> "$GITHUB_OUTPUT"
          else
            count=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number --jq length)
            echo "has_pr=$count" >> "$GITHUB_OUTPUT"
          fi

  checkstyle:
    needs: dedupe
    if: ${{ !cancelled() && (github.event_name != 'push' || needs.dedupe.outputs.has_pr == '0') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: "desktop: checkstyle"
        working-directory: desktop
        run: ./gradlew checkstyleMain checkstyleTest --no-daemon
      - name: "backend: checkstyle"
        working-directory: backend
        run: ./gradlew checkstyleMain checkstyleTest --no-daemon
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: "frontend: install"
        working-directory: frontend
        run: npm ci
      - name: "frontend: lint"
        working-directory: frontend
        run: npm run lint
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: checkstyle-reports
          path: |
            desktop/build/reports/checkstyle
            backend/build/reports/checkstyle

  build:
    # Pull requests, and pushes to development or main; a plain feature-branch push is covered by
    # checkstyle until its pull request opens.
    needs: dedupe
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/development') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # AGENTS.md § 2 approval gate: a pull request into development may not merge a branch state that is not
      # Approved by the owner or that still has live session rows. The changed files come from the API because
      # the checkout is shallow.
      - name: "repo: branch states are approved before merge"
        if: ${{ github.event_name == 'pull_request' && github.base_ref == 'development' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --paginate \
            --jq '.[] | select(.status != "removed") | .filename' \
            | grep -E '^docs/project-state/branch-states/[^/]+\.md$' || true)
          if [ -z "$files" ]; then
            echo "No branch state in this pull request."
            exit 0
          fi
          bash .github/scripts/check-branch-states.sh $files
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: "desktop: build (xvfb gives the TestFX suites a virtual display)"
        working-directory: desktop
        run: xvfb-run -a ./gradlew build --no-daemon
      - name: "backend: build (Testcontainers uses the runner's Docker)"
        working-directory: backend
        run: ./gradlew build --no-daemon
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: "frontend: install"
        working-directory: frontend
        run: npm ci
      - name: "frontend: test"
        working-directory: frontend
        run: npm test
      - name: "frontend: build"
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY || 'ci-api-key' }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN || 'ci.firebaseapp.com' }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID || 'ci-project' }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ vars.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET || 'ci.firebasestorage.app' }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID || '000000000000' }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID || 'ci-app-id' }}
        run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            desktop/build/reports/tests
            backend/build/reports/tests
