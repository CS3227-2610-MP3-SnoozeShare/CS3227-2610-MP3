# Render Blueprint for the dev backend. Secret values are entered in the Render dashboard (sync: false).
services:
  - type: web
    name: snoozeshare-api
    runtime: docker
    plan: free
    branch: development
    autoDeploy: true
    # Redeploy only when the backend or this Blueprint changes, not for documentation or frontend pushes.
    buildFilter:
      paths:
        - backend/**
        - render.yaml
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=70
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: SNOOZESHARE_CORS_ALLOWED_ORIGIN
        sync: false
