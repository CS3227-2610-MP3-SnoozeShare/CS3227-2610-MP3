title: SnoozeShare
description: CS3227 Mini Project 3

# Published by .github/workflows/jekyll-gh-pages.yml (Settings > Pages > Source = GitHub
# Actions), which builds this docs/ folder with Jekyll on every push to main.
theme: jekyll-theme-cayman

# kramdown with GitHub-flavoured Markdown, so pipe tables, fenced code and task lists render.
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge

# Renders :bulb:, :camera: and :exclamation: shortcodes as emoji.
plugins:
  - jemoji

defaults:
  - scope:
      path: ""
    values:
      layout: default

# Working documents that belong in the repository but not on the published site.
exclude:
  - Gemfile
  - Gemfile.lock
  - MP2-feedback-triage.md
  - project-history
  - project-state
  - superpowers
